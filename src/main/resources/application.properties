spring.application.name=secure-student-management

spring.datasource.url=${DB_URL:jdbc:h2:mem:studentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=true

app.jwt.secret=QmFzZTY0U2VjcmV0S2V5Rm9yU2VjdXJlU3R1ZGVudE1hbmFnZW1lbnQ=
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
